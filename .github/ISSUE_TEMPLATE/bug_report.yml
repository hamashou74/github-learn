name: Bug Report
description: Report a problem to help us improve.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Security notice:** If this is a security vulnerability, please do **not** open a public issue.
        Use the security reporting process described in SECURITY.md (or the link in the template chooser).

        Please write this report in **English**.

  - type: checkboxes
    id: duplicates
    attributes:
      label: Is there an existing issue for this?
      description: Please search the existing issues before creating a new one.
      options:
        - label: I have searched the existing issues.
          required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What is happening? Include screenshots if relevant.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: A clear and concise description of what you expected.
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal, precise steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. Run '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: repro_example
    attributes:
      label: Minimal reproducible example (if applicable)
      description: Provide a small, self-contained example (code/config/data) that reproduces the issue.
      placeholder: |
        ```text
        Paste a minimal snippet here (logs, code, config, etc.)
        ```
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      description: Paste any relevant logs or console output.
      render: shell
      placeholder: |
        Paste logs here.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Affected version(s)
      description: What version(s) are impacted?
      placeholder: e.g. 1.2.3
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does this occur?
      multiple: false
      options:
        - Local development
        - CI
        - Staging
        - Production
        - Other
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Anything else that may help us diagnose the issue.
    validations:
      required: false
