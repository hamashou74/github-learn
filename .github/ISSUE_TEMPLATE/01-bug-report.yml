name: Bug Report
description: Report a defect in the product (non-emergency).
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        **GitFlow note**
        - Typical fixes: create a `bugfix/<issue-number>-<short-slug>` branch from `develop`.
        - Production emergencies: use the **Hotfix** template instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the issue appear?
      options:
        - Backend (API)
        - Frontend (Web)
        - Infrastructure / DevOps
        - Documentation
        - Unknown / Not sure
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Business/operational impact.
      options:
        - S1 - Critical (data loss / security / major outage)
        - S2 - High (major functionality broken)
        - S3 - Medium (partial impact, workaround exists)
        - S4 - Low (minor issue)
    validations:
      required: true

  - type: input
    id: affected_version
    attributes:
      label: Affected version / commit
      description: Release tag, commit SHA, or build identifier.
      placeholder: "e.g., v1.4.2, 1a2b3c4, staging-2026-01-13"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Development
        - Other / Not sure
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Browser(s) (Frontend only)
      description: Skip if not applicable.
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Microsoft Edge
        - Other
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and context.
      placeholder: "A clear, concise description of the problem."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Describe the expected behavior."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal, reliable steps.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / stack trace
      description: Paste logs (redact secrets). This will be formatted as code automatically.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I confirmed no secrets (tokens, passwords, private keys) are included in this report.
          required: true
