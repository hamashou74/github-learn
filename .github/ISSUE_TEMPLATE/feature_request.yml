name: Feature Request
description: Propose a new feature or improvement.
title: "[Feature]: "
labels: ["type:feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for product features and enhancements.

        **GitFlow note**
        - Implement features on `feature/<issue-number>-<short-slug>` from `develop`.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API)
        - Frontend (Web)
        - Infrastructure / DevOps
        - Documentation
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are we solving, and for whom?
      placeholder: "As a <user>, I want <capability>, so that <benefit>."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed approach at a high level.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List alternative approaches and trade-offs.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define "done" in verifiable terms.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals / out of scope
      description: What is explicitly not included?
    validations:
      required: false

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
