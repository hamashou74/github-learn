name: Chore / Tech Debt
description: Refactoring, dependency updates, tooling, CI/CD, or housekeeping.
title: "[Chore]: "
labels: ["type:chore"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API)
        - Frontend (Web)
        - Infrastructure / DevOps
        - Documentation
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed? What pain does it address?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What will be changed? What will not be changed?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / migration notes
    validations:
      required: false
