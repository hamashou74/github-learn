name: Update Labels
on:
  push:
    branches: [master]
jobs:
  labeling:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - name: Install dependencies
        run: npm install --global @azu/github-label-setup
      - name: update labels
        run: github-label-setup --token ${{ secrets.GITHUB_TOKEN }} --labels .github/labels.json
