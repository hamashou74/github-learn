name: Update Labels
on:
  push:
    branches: [main]
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - name: Install dependencies
        run: npm install --global @azu/github-label-setup
      - name: update labels
        run: $ github-label-setup --token ${{ secrets.GITHUB_TOKEN }} --labels @owner/github-label-presets
